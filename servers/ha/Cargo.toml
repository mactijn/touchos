[package]
name = "touchos-srv-ha"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Home Assistant client: WebSocket API over TLS, publishes entity state for the dashboard"

[[bin]]
name = "ha"
path = "src/main.rs"
test = false
bench = false

[dependencies]
touchos-rt = { path = "../../libs/rt" }
touchos-proto = { path = "../../libs/proto" }
touchos-config = { path = "../../libs/config" }
touchos-http = { path = "../../libs/http" }
touchos-hass = { path = "../../libs/hass" }
touchos-netc = { path = "../../libs/netc", features = ["tls"] }
log.workspace = true
spin.workspace = true
serde_json.workspace = true
