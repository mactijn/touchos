[package]
name = "touchos-netc"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Client of the touchos net server: TCP streams, DNS, TLS"

[lib]
test = false
bench = false

[features]
tls = [
    "dep:rustls", "dep:rustls-rustcrypto", "dep:rustls-pki-types", "dep:webpki",
    "dep:getrandom", "dep:touchos-certs", "dep:spin",
]

[dependencies]
touchos-rt = { path = "../rt" }
touchos-abi = { path = "../abi" }
touchos-proto = { path = "../proto" }
log.workspace = true
# TLS: rustls without std (its unbuffered API), the RustCrypto provider,
# and rustls-webpki for the certificates. getrandom is the provider's
# randomness, with a "custom" backend (see tls.rs and .cargo/config.toml).
rustls = { version = "0.23.46", default-features = false, features = ["logging", "tls12"], optional = true }
rustls-rustcrypto = { version = "=0.1.0-pre.0", default-features = false, features = ["alloc", "tls12", "zeroize", "logging"], optional = true }
rustls-pki-types = { version = "1.16", default-features = false, features = ["alloc"], optional = true }
webpki = { package = "rustls-webpki", version = "0.103.17", default-features = false, features = ["alloc"], optional = true }
getrandom = { version = "0.4", default-features = false, optional = true }
touchos-certs = { path = "../certs", optional = true }
spin = { workspace = true, optional = true }
