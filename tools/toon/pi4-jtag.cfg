# OpenOCD interface config: the Raspberry Pi 4's GPIO header as a JTAG
# adapter for the Toon v1, wired as in tools/toon/README.md (ToonRooter's
# table). OpenOCD 0.12's interface/raspberrypi-native.cfg moved TMS to GPIO 8,
# which is TRST on this wiring, so this file sets every pin explicitly.
#
#   openocd -f pi4-jtag.cfg -f ed20.cfg

adapter driver bcm2835gpio

# Bit-bang timing, as in interface/raspberrypi-native.cfg for the BCM2711:
# 4 CPU clocks per loop, offset 52.
proc toon_cpu_khz {} {
	if {[catch {open /sys/devices/system/cpu/cpu0/cpufreq/scaling_max_freq r} fd]} {
		return 1500000
	}
	set khz [string trim [read $fd]]
	close $fd
	return $khz
}
bcm2835gpio speed_coeffs [expr {[toon_cpu_khz] / 4}] 52

#                         GPIO   Pi header pin   Toon header pin
adapter gpio tck  -chip 0 11   ;# 23            4
adapter gpio tms  -chip 0 25   ;# 22            6
adapter gpio tdi  -chip 0 10   ;# 19            8
adapter gpio tdo  -chip 0 9    ;# 21            10
adapter gpio trst -chip 0 8    ;# 24            2
adapter gpio srst -chip 0 24   ;# 18            7
# Between resets OpenOCD leaves SRST/TRST as inputs (open drain), held high
# by the Toon only; and GPIO 24 has the Pi's pull-DOWN by default. bcm2835gpio
# cannot set pulls, so toon-ocd sets pull-ups with pinctrl before each run.
# (A board once reset in the middle of a long 8 MHz dump; a glitch on SRST is
# one explanation, a power dip the other.)

transport select jtag

# Fastest reliable clock, measured on the bench: every
# speed from 500 kHz to 32 MHz reads identical data; throughput levels off at
# about 150 KiB/s from 8 MHz (the bit-banging, not the wiring, is the limit).
set TOON_JTAG_KHZ 8000
adapter speed $TOON_JTAG_KHZ
